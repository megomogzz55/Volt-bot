name: Kora Volt - Mega News Engine

on:
  schedule:
    - cron: '0 */2 * * *'
    - cron: '30 1,5,9,13,17,21 * * *'
  workflow_dispatch:

jobs:
  publish_kora_volt_news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Publish 3 Rich News Posts to Kora Volt
        env:
          FB_NEWS_PAGE_ID: ${{ secrets.FB_NEWS_PAGE_ID }}
          FB_NEWS_ACCESS_TOKEN: ${{ secrets.FB_NEWS_ACCESS_TOKEN }}
        run: python bot.py mega-news --publish --count 3 --page kora_volt

      - name: Save State to Prevent Duplication
        run: |
          git config --local user.email "bot@volt.com"
          git config --local user.name "Volt Automation Bot"
          git add data/
          git diff-index --quiet HEAD || (git commit -m "chore: sync mega news state [skip ci]" && git push)
