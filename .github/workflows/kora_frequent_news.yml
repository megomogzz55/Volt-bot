name: Kora Volt - Frequent Football News

on:
  schedule:
    # Runs every 2 hours (12 posts per day across all hours)
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  publish_news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch Fresh Breaking News & Publish
        env:
          FB_NEWS_PAGE_ID: ${{ secrets.FB_NEWS_PAGE_ID || secrets.KV_PAGE_ID }}
          FB_NEWS_ACCESS_TOKEN: ${{ secrets.FB_NEWS_ACCESS_TOKEN || secrets.KV_ACCESS_TOKEN }}
        run: |
          python bot.py photo-news --publish --count 1
