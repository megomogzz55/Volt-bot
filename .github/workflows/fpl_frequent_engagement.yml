name: Fantasy Volt - Frequent Content Stream

on:
  schedule:
    # 10:00, 14:00, 18:00, 21:00 UTC (12:00 PM, 04:00 PM, 08:00 PM, 11:00 PM Cairo)
    - cron: '0 10,14,18,21 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Post Type'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'quiz'
          - 'facts'
          - 'picks'
          - 'differentials'
          - 'price-alert'

jobs:
  publish_fantasy_content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Publish Varied Fantasy Content with Real Photos
        env:
          FB_FANTASY_PAGE_ID: ${{ secrets.FB_FANTASY_PAGE_ID || secrets.FV_PAGE_ID }}
          FB_FANTASY_ACCESS_TOKEN: ${{ secrets.FB_FANTASY_ACCESS_TOKEN || secrets.FV_ACCESS_TOKEN }}
        run: |
          python -c "
          import random, subprocess
          choices = ['fpl-quiz', 'fpl-facts', 'fpl-picks', 'fpl-differentials', 'fpl-price-alert']
          cmd = random.choice(choices)
          print('Selected Auto Command:', cmd)
          subprocess.run(['python', 'bot.py', cmd, '--publish'], check=True)
          "
