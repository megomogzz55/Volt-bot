
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Montserrat:wght@900&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: linear-gradient(135deg, #0B97A9 0%, #066D7D 100%);
    font-family: 'Almarai', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding: 60px 40px;
  }
  
  /* Brand */
  .brand-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
  }
  
  .brand-sub {
    font-family: 'Montserrat', sans-serif;
    font-size: 26px;
    font-weight: 900;
    color: #FF6363;
    -webkit-text-stroke: 1.5px #000000;
    letter-spacing: 4px;
  }
  
  .brand-main {
    font-family: 'Montserrat', sans-serif;
    font-size: 55px;
    font-weight: 900;
    color: #FF6363;
    -webkit-text-stroke: 2.5px #000000;
    letter-spacing: 6px;
    margin-top: -8px;
  }
  
  /* Title */
  .bonus-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 130px;
    font-weight: 900;
    color: #FF6363;
    -webkit-text-stroke: 5px #000000;
    letter-spacing: 4px;
    margin-bottom: 40px;
    text-shadow: 6px 8px 0px rgba(0,0,0,0.3);
  }
  
  /* List Rows */
  .rows-container {
    width: 1000px;
    display: flex;
    flex-direction: column;
    gap: 35px;
    margin-top: 20px;
  }
  
  .bonus-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
  }
  
  .player-name {
    font-size: 90px;
    font-weight: 800;
    color: #FF6363;
    -webkit-text-stroke: 4.5px #000000;
    text-shadow: 5px 6px 0px rgba(0,0,0,0.25);
  }
  
  .points-num {
    font-family: 'Montserrat', sans-serif;
    font-size: 130px;
    font-weight: 900;
    color: #FF6363;
    -webkit-text-stroke: 5px #000000;
    text-shadow: 5px 6px 0px rgba(0,0,0,0.25);
    min-width: 120px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="brand-logo">
    <div class="brand-sub">FANTASY</div>
    <div class="brand-main">VOLT</div>
  </div>
  
  <div class="bonus-title">BONUS</div>
  
  <div class="rows-container">
    <div class="bonus-row">
      <div class="player-name">سيمينيو</div>
      <div class="points-num">3</div>
    </div>
    
    <div class="bonus-row">
      <div class="player-name">إيكيتيكي</div>
      <div class="points-num">2</div>
    </div>
    
    <div class="bonus-row">
      <div class="player-name">صلاح باشا</div>
      <div class="points-num">1</div>
    </div>
  </div>
</body>
</html>
