
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Montserrat:wght@900&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #0B1118;
    font-family: 'Almarai', sans-serif;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  
  /* Split Background with Pop-Art Ben-Day Dot Pattern */
  .bg-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 675px;
    background: linear-gradient(135deg, #028E9B 0%, #005662 100%);
    overflow: hidden;
  }
  
  .bg-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1080px;
    height: 675px;
    background: linear-gradient(135deg, #F0484C 0%, #B71C1C 100%);
    overflow: hidden;
  }
  
  /* Ben-Day Halftone Dot Screen */
  .halftone {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(rgba(0, 0, 0, 0.22) 20%, transparent 20%);
    background-size: 24px 24px;
    pointer-events: none;
  }
  
  /* Main Container */
  .container {
    position: relative;
    z-index: 2;
    width: 1080px;
    height: 1350px;
    display: flex;
    flex-direction: column;
    padding: 60px 50px;
  }
  
  /* Top Branding Header */
  .top-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 20px;
  }
  
  .brand-logo-wrap {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  
  .brand-lion {
    width: 60px;
    height: 60px;
    background: url('file:///C:/Users/Mogz/fantasy-volt/assets/pl_lion_600.png') no-repeat center;
    background-size: contain;
    filter: brightness(0) invert(1);
  }
  
  .brand-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #FFFFFF;
    letter-spacing: 3px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  
  .match-pill {
    background: rgba(10, 13, 16, 0.85);
    border: 2px solid #00E5FF;
    padding: 10px 24px;
    border-radius: 25px;
    color: #00E5FF;
    font-size: 24px;
    font-weight: 800;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  
  /* Central Content Grid: Hero Vector Avatar + Goal Details */
  .main-grid {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 40px;
    height: 1000px;
  }
  
  /* Right Side: Vector Player Artwork */
  .vector-hero-container {
    width: 480px;
    height: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  .vector-frame {
    width: 460px;
    height: 620px;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    border: 8px solid #FFFFFF;
    box-shadow: 
      0 20px 50px rgba(0,0,0,0.7),
      0 0 0 16px rgba(10, 13, 16, 0.5);
    background: #A51010;
  }
  
  .vector-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  /* Left Side: Goal & Assist Action Cards */
  .details-container {
    width: 480px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  
  .action-block {
    background: rgba(10, 17, 24, 0.75);
    backdrop-filter: blur(10px);
    border-radius: 35px;
    padding: 40px 35px;
    border: 4px solid #00E5FF;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  
  .assist-block {
    border-color: #FF5252;
  }
  
  .action-tag {
    font-family: 'Montserrat', sans-serif;
    font-size: 85px;
    font-weight: 900;
    color: #FFFFFF;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 15px;
    text-shadow: 
      0 0 15px #FFFFFF,
      0 0 30px rgba(0, 229, 255, 0.9);
  }
  
  .assist-tag {
    text-shadow: 
      0 0 15px #FFFFFF,
      0 0 30px rgba(255, 82, 82, 0.9);
  }
  
  .player-name {
    font-size: 65px;
    font-weight: 800;
    color: #FFFFFF;
    text-shadow: 3px 4px 0px #000000;
    line-height: 1.2;
  }
  
  .team-sub {
    font-size: 26px;
    font-weight: 700;
    color: #00E5FF;
    margin-top: 8px;
  }
  
  .assist-team {
    color: #FF8A80;
  }
  
  /* Footer Slogan */
  .footer-slogan {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    font-weight: 800;
    color: #00E5FF;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <!-- Split Pop-art Background -->
  <div class="bg-top"><div class="halftone"></div></div>
  <div class="bg-bottom"><div class="halftone"></div></div>
  
  <div class="container">
    <!-- Top Header -->
    <div class="top-brand">
      <div class="brand-logo-wrap">
        <div class="brand-lion"></div>
        <div class="brand-title">FANTASY VOLT</div>
      </div>
      <div class="match-pill">⏱️ الدقيقة 34'</div>
    </div>
    
    <!-- Main Content: Hero Vector Art + Action Details -->
    <div class="main-grid">
      <!-- Right: Vector Art Portrait -->
      <div class="vector-hero-container">
        <div class="vector-frame">
          <img class="vector-img" src="file:///C:/Users/Mogz/fantasy-volt/assets/vectors/salah_pop.jpg" alt="Mohamed Salah Vector">
        </div>
      </div>
      
      <!-- Left: Goal & Assist Cards -->
      <div class="details-container">
        <!-- Goal Block -->
        <div class="action-block">
          <div class="action-tag">GOAL</div>
          <div class="player-name">محمد صلاح</div>
          <div class="team-sub">ليفربول • 12 مساهمة</div>
        </div>
        
        <!-- Assist Block -->
        <div class="action-block assist-block">
          <div class="action-tag assist-tag">ASSIST</div>
          <div class="player-name">لويس دياز</div>
          <div class="team-sub assist-team">ليفربول • صناعة هدف</div>
        </div>
      </div>
    </div>
    
    <div class="footer-slogan">لو مش متابع ڤولت.. بتلعب فانتازي غلط ⚡</div>
  </div>
</body>
</html>
